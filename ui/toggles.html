<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kurmay</title>
<link rel="icon" href="data:,"><!-- logo yok: tarayıcı /favicon.ico istemesin -->
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script><!-- tema: stil hesaplanmadan önce uygulanır -->
<style>
body { padding:24px 16px; }
a { color:var(--blue); }
.wrap { max-width:680px; margin-inline:auto; }
.hdr { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:22px; background:var(--md-surface-container-high); box-shadow:var(--md-elev-2); border-radius:var(--md-shape-lg); padding:14px 20px; }
.hdr .sp { flex:1; }
.hdr .ic { font-size:17px; line-height:1; color:var(--muted); text-decoration:none; }
.hdr .ic:hover { color:var(--blue); }
.intro { font-size:13px; color:var(--muted); line-height:1.5; margin:0 16px 18px; }

/* iPhone "Ayarlar" görünümü: gruplu liste — başlık, yuvarlak köşeli kutu içinde
   ince çizgiyle ayrılmış satırlar, altta açıklama */
.sec { margin-bottom:26px; }
.sec-h { font:var(--md-type-label-sm); letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:0 16px 7px; }
.sec-f { font-size:12.5px; color:var(--muted); line-height:1.45; margin:7px 16px 0; }
.group { background:var(--md-surface-container-lowest); border-radius:var(--md-shape-md); overflow:hidden; box-shadow:var(--md-elev-1); }
:is([data-theme="radar"], [data-theme="karargah"], [data-theme="gece"]) .group { box-shadow:none; border:1px solid var(--md-outline-variant); }
:is([data-theme="harita"], [data-theme="sade"]) .group { border:1px solid var(--md-outline-variant); }
.row { display:flex; align-items:center; gap:13px; padding:11px 16px; min-height:56px; position:relative; cursor:pointer; }
/* Ayırıcı çizgi simgenin hizasından başlar (iPhone'daki gibi) */
.row + .row::before { content:""; position:absolute; top:0; right:0; left:60px; border-top:1px solid var(--md-outline-variant); }
.row.off .txt { opacity:.55; }
.icon { flex:none; width:31px; height:31px; border-radius:8px; display:grid; place-items:center; font-size:15px; font-weight:700;
  color:#fff; font-family:system-ui,"Segoe UI",sans-serif; }
/* Koyu temalarda rol renkleri açık ton — simge beyaz kalınca okunmuyordu, zeminin koyusu */
:is([data-theme="radar"], [data-theme="karargah"], [data-theme="gece"]) .icon { color:var(--md-surface); }
.txt { flex:1; min-width:0; transition:opacity 200ms; }
.ttl { font:var(--md-type-title-md); display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
.sub { display:block; font-size:12.5px; color:var(--muted); line-height:1.4; margin-top:2px; overflow-wrap:anywhere; }
.tag { font:var(--md-type-label-sm); padding:1px 8px; border-radius:var(--md-shape-full); background:var(--tealBg); color:var(--teal); }
.tag.warn { background:var(--redBg); color:var(--red); }
.empty { padding:16px; font-size:13px; color:var(--muted); }

/* Anahtar (iPhone açma/kapama düğmesi): checkbox, role=switch. Temaların köşe
   kurallarına takılmasın diye yarıçaplar !important. */
.sw { appearance:none; -webkit-appearance:none; flex:none; position:relative; width:51px; height:31px; margin:0; cursor:pointer;
  border-radius:999px !important; background:var(--md-outline-variant); transition:background-color 220ms ease; }
.sw::after { content:""; position:absolute; top:2px; left:2px; width:27px; height:27px; border-radius:50% !important; background:#fff;
  box-shadow:0 3px 8px rgba(0,0,0,.18), 0 1px 1px rgba(0,0,0,.16); transition:transform 220ms cubic-bezier(.3,.7,.4,1); }
/* Koyu temalarda ince çizgi rengi zemine çok yakın — kapalı anahtar seçilsin diye bir ton açık */
:is([data-theme="radar"], [data-theme="karargah"], [data-theme="gece"]) .sw { background:var(--md-outline); }
.sw:checked, [data-theme] .sw:checked { background:var(--md-secondary); }
.sw:checked::after { transform:translateX(20px); }
.sw:active::after { width:31px; } /* basılıyken topuz uzar */
.sw:checked:active::after { transform:translateX(16px); }
.sw:focus-visible { outline:2px solid var(--md-primary); outline-offset:2px; }
.sw:disabled { opacity:.5; cursor:default; }

#toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); max-width:min(560px, calc(100% - 32px));
  background:var(--md-error-container); color:var(--md-on-error-container); padding:10px 16px; border-radius:var(--md-shape-md);
  box-shadow:var(--md-elev-3); font-size:13px; line-height:1.4; display:none; }
#toast.show { display:block; }
@media (max-width:520px) { body { padding:12px 10px; } .hdr { padding:12px 14px; } }
</style>
</head>
<body>
<div class="wrap">

<div class="hdr">
  <span class="brand">Kurmay</span>
  <span class="sp"></span>
  <div class="tswitch" role="radiogroup" aria-label="Tema"></div>
  <a class="ic" href="/config" title="Ayarlar" aria-label="Ayarlar">⚙</a>
  <a href="/">← izleme paneli</a>
</div>

<p class="intro">Değişiklik anında kaydedilir ve sıradaki görevde geçerli olur; çalışan görevler başladıkları ayarlarla devam eder.</p>

<div id="secs"></div>
</div>
<div id="toast" role="alert"></div>

<script>
const $ = (id) => document.getElementById(id);
function esc(s){ return String(s).replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

// Görünen adlar — config anahtarları teknik kalır, ekranda Türkçe ad (panel/ayarlar ile aynı)
const NODE_NAMES = { analist:"Analist", saha:"Saha ajanı", teftis:"Teftiş", guvenlik:"Güvenlik Denetçisi" };
const ROLE_ICONS = { analist:["◎","var(--arch)"], saha:["</>","var(--dev)"], teftis:["✓","var(--rev)"], guvenlik:["🛡","var(--teal)"] };
let data = null;

/** Düğüm anahtarı → ekrandaki ad. Dağıtımın işçisi takımın adıyla görünür ("Saha Timi"):
 *  kapatınca tüm takım atlanır */
function nodeName(k) {
  const a = data.agents.find((x) => x.key === k);
  if (a && a.fanout) return k === "saha" ? "Saha Timi" : `${NODE_NAMES[k] || k} ekibi`;
  return NODE_NAMES[k] || k;
}
const usedByText = (list) => list.length ? "Kullanan: " + list.map(nodeName).join(", ") : "Hiçbir ajan kullanmıyor";

function row({ kind, name, title, sub, icon, color, tags, on }) {
  const id = `sw-${kind}-${name}`;
  return `<label class="row${on ? "" : " off"}" for="${esc(id)}">
    <span class="icon" style="background:${color}">${esc(icon)}</span>
    <span class="txt"><span class="ttl">${esc(title)}${(tags || []).join("")}</span>${sub ? `<span class="sub">${esc(sub)}</span>` : ""}</span>
    <input type="checkbox" role="switch" class="sw" id="${esc(id)}" data-kind="${kind}" data-name="${esc(name)}" ${on ? "checked" : ""} aria-label="${esc(title)}">
  </label>`;
}

function section(title, rows, foot, emptyText) {
  return `<div class="sec"><div class="sec-h">${esc(title)}</div>
    <div class="group">${rows.length ? rows.join("") : `<div class="empty">${esc(emptyText)}</div>`}</div>
    ${foot ? `<div class="sec-f">${esc(foot)}</div>` : ""}</div>`;
}

function render() {
  const agents = data.agents.filter((a) => a.type === "agent");
  const agentRows = agents.map((a) => {
    const [icon, color] = ROLE_ICONS[a.key] || [nodeName(a.key).slice(0, 1).toUpperCase(), "var(--oth)"];
    const tags = [];
    if (a.key === data.entry) tags.push(`<span class="tag">başlangıç</span>`);
    return row({ kind: "agent", name: a.key, title: nodeName(a.key), sub: a.description, icon, color, tags, on: !a.disabled });
  });
  const ruleRows = (data.rules || []).map((r) => row({
    kind: "rule", name: r.name, title: r.name, icon: "§", color: "var(--red)",
    sub: [r.description, usedByText(r.usedBy)].filter(Boolean).join(" · "),
    tags: r.missing ? [`<span class="tag warn">dosyası yok</span>`] : [],
    on: !r.disabled,
  }));
  const skillRows = data.skills.map((s) => row({
    kind: "skill", name: s.name, title: s.name, icon: "📘", color: "var(--amber)",
    sub: [s.description, usedByText(s.usedBy)].filter(Boolean).join(" · "),
    tags: s.missing ? [`<span class="tag warn">dosyası yok</span>`] : [],
    on: !s.disabled,
  }));
  const mcpRows = data.mcpServers.map((m) => row({
    kind: "mcp", name: m.name, title: m.name, icon: "🔌", color: "var(--dev)",
    sub: usedByText(m.usedBy), on: !m.disabled,
  }));
  $("secs").innerHTML =
    section("Ajanlar", agentRows,
      "Kapalı ajan akışta atlanır, akış onun ardından gelen adımla sürer. Saha Timi kapalıysa hiçbir mıntıkada kod yazılmaz.",
      "Akışta ajan yok.") +
    section("Kurallar", ruleRows,
      "Kurallar ajanın talimatına her zaman eklenen kısıtlardır. Kapalı kural, ajanın ayarlarında listelenmiş olsa bile hiçbir ajana verilmez.",
      "Henüz kural yok.") +
    section("Beceriler", skillRows,
      "Kapalı beceri, ajanın ayarlarında listelenmiş olsa bile hiçbir ajana sunulmaz.",
      "Henüz beceri yok.") +
    section("Eklentiler", mcpRows,
      "Kapalı eklenti başlatılmaz; araçları ajanların araç listesinden çıkar.",
      "Tanımlı eklenti yok.");
}

let toastTimer;
function toast(msg) {
  $("toast").textContent = msg;
  $("toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("toast").classList.remove("show"), 6000);
}

async function load() {
  try {
    const r = await fetch("/toggles-data");
    data = await r.json();
    render();
  } catch (e) {
    $("secs").innerHTML = `<div class="sec"><div class="group"><div class="empty">Liste alınamadı — servis çalışıyor mu?</div></div></div>`;
  }
}

// Anahtar değişince hemen kaydet; hata olursa eski konumuna döndür
document.addEventListener("change", async (ev) => {
  const el = ev.target;
  if (!el.classList || !el.classList.contains("sw")) return;
  const on = el.checked;
  el.closest(".row").classList.toggle("off", !on);
  el.disabled = true;
  try {
    const r = await fetch("/toggle", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ kind: el.dataset.kind, name: el.dataset.name, disabled: !on }),
    });
    const res = await r.json().catch(() => ({}));
    if (!r.ok || !res.ok) throw new Error(res.error || "kaydedilemedi");
    await load(); // "kullanan" bilgileri ve başka sekmelerdeki değişiklikler güncellensin
  } catch (e) {
    el.checked = !on;
    el.closest(".row").classList.toggle("off", on);
    el.disabled = false;
    toast("Değiştirilemedi: " + e.message);
  }
});

load();
</script>
</body>
</html>
