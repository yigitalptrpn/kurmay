<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Güvenlik Denetim Raporu</title>
<link rel="icon" href="data:,">
<style>
/* Güvenlik denetim raporunun basılı (PDF) şablonu — /guvenlik/rapor/<id>. Sunucu rapor
   verisini sayfaya gömer (aşağıdaki RAPOR), betik belgeyi yükleme sırasında çizer: başsız
   tarayıcı PDF'i basarken veri beklemez. A4, açık zemin; önem renkleri ve kalkan rapor
   sayfasıyla (ui/guvenlik.html) aynı aileden, renk hiçbir yerde tek başına anlam taşımaz. */
@font-face { font-family:"Geist"; font-weight:100 900; font-display:block; src:url(/fonts/geist-latin.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
@font-face { font-family:"Geist"; font-weight:100 900; font-display:block; src:url(/fonts/geist-latin-ext.woff2) format("woff2");
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
@font-face { font-family:"Geist Mono"; font-weight:100 900; font-display:block; src:url(/fonts/geist-mono-latin.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
@font-face { font-family:"Geist Mono"; font-weight:100 900; font-display:block; src:url(/fonts/geist-mono-latin-ext.woff2) format("woff2");
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }

/* Sayfa altı (rapor no + sayfa numarası) betikle eklenir: @page içeriği rapora göre değişiyor */
@page { size:A4; margin:16mm 16mm 18mm; }

:root {
  --ink:#0f172a; --ink2:#334155; --muted:#64748b; --faint:#94a3b8; --line:#e2e8f0; --soft:#f8fafc; --soft2:#f1f5f9;
  --accent:#0369a1; --accent2:#0ea5e9;
  --crit:#c62f37; --high:#d65a24; --med:#b27a00; --low:#2a74b8; --info:#64748b; --good:#15803d;
  --sans:"Geist",system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,Consolas,monospace;
}
* { box-sizing:border-box; }
html { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
body { margin:0; font:9.5pt/1.55 var(--sans); color:var(--ink); background:#d9dee5; }
svg.i { width:1.1em; height:1.1em; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; vertical-align:-.15em; }

/* Ekranda: A4 sayfa önizlemesi + üstte araç çubuğu (baskıya girmez) */
.arac { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px; padding:10px 18px;
  background:rgba(15,23,42,.92); color:#e2e8f0; font:13px var(--sans); }
.arac a { color:#bae6fd; text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
.arac .sp { flex:1; }
.arac button { font:600 13px var(--sans); display:inline-flex; align-items:center; gap:7px; cursor:pointer; padding:8px 14px; border-radius:8px;
  border:1px solid #475569; background:#1e293b; color:#f1f5f9; }
.arac button.ana { background:#0ea5e9; border-color:#0ea5e9; color:#04121c; }
.arac button:disabled { opacity:.6; cursor:wait; }
.arac .durum { color:#fca5a5; }
.kagit { width:210mm; min-height:297mm; margin:24px auto; padding:16mm; background:#fff; box-shadow:0 10px 40px rgba(15,23,42,.18); }
@media print {
  body { background:#fff; }
  .arac { display:none; }
  .kagit { width:auto; min-height:0; margin:0; padding:0; box-shadow:none; }
}
@media (max-width:820px) { .kagit { width:auto; margin:12px; padding:18px; min-height:0; } }

/* Başlık şeridi */
.bas { display:flex; align-items:center; gap:14px; padding-bottom:12px; }
.marka { display:flex; align-items:center; gap:10px; }
.marka .m { width:30px; height:30px; border-radius:8px; display:grid; place-items:center; color:#fff; background:linear-gradient(135deg, var(--accent2), var(--accent)); }
.marka .m svg { width:17px; height:17px; }
.marka b { display:block; font-size:11pt; letter-spacing:.08em; }
.marka span { display:block; font-size:7.5pt; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
.bas .sp { flex:1; }
.bas .no { text-align:right; font-size:7.5pt; color:var(--muted); line-height:1.45; }
.bas .no b { display:block; font:600 9pt var(--mono); color:var(--ink); }
.serit { height:4px; border-radius:2px; background:linear-gradient(90deg, var(--accent), var(--accent2) 55%, #a5f3fc); margin-bottom:16px; }

/* Kapak: tür, başlık, risk, künye */
.tur { display:inline-flex; align-items:center; gap:6px; font-size:7.5pt; letter-spacing:.12em; text-transform:uppercase; color:var(--accent);
  border:1px solid #bae6fd; background:#f0f9ff; border-radius:999px; padding:3px 10px; }
h1 { font-size:19pt; line-height:1.25; margin:10px 0 16px; letter-spacing:-.01em; font-weight:700; overflow-wrap:anywhere; }
.risk { display:grid; grid-template-columns:auto minmax(0,1fr); gap:20px; align-items:center; padding:16px 18px; border:1px solid var(--line);
  border-radius:12px; background:linear-gradient(180deg, color-mix(in srgb, var(--c) 7%, #fff), #fff); break-inside:avoid; }
.kalkan { width:92px; height:104px; position:relative; display:grid; place-items:center; }
.kalkan svg { position:absolute; inset:0; width:100%; height:100%; }
.kalkan .y { position:relative; text-align:center; margin-top:-4px; }
.kalkan .y b { display:block; font-size:12pt; color:var(--c); }
.kalkan .y span { font-size:6.5pt; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
.etiket { font-size:7.5pt; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600; }
.seviye { font-size:16pt; font-weight:700; color:var(--c); margin:2px 0 8px; }
.olcek { display:grid; grid-template-columns:repeat(5,1fr); gap:3px; max-width:330px; }
.olcek i { height:6px; border-radius:3px; background:var(--soft2); }
.olcek i.d { background:var(--c); }
.olcek-y { display:grid; grid-template-columns:repeat(5,1fr); max-width:330px; font-size:6.8pt; color:var(--faint); margin-top:3px; }
.olcek-y .s { color:var(--ink); font-weight:600; }
.risk p { margin:10px 0 0; color:var(--ink2); }

table.kunye { width:100%; border-collapse:collapse; margin-top:14px; font-size:8.8pt; break-inside:avoid; }
.kunye th { text-align:left; width:34mm; font-weight:500; color:var(--muted); padding:5px 10px 5px 0; vertical-align:top; border-bottom:1px solid var(--line); }
.kunye td { padding:5px 0; border-bottom:1px solid var(--line); overflow-wrap:anywhere; }
.kunye td.mono { font:8.4pt var(--mono); }

/* Bölümler */
section { margin-top:20px; }
h2 { display:flex; align-items:baseline; gap:8px; font-size:11.5pt; margin:0 0 10px; padding-bottom:6px; border-bottom:2px solid var(--ink); break-after:avoid; }
h2 .n { font:600 9pt var(--mono); color:var(--accent); }
p.ozet { margin:0; font-size:10pt; line-height:1.65; color:var(--ink2); white-space:pre-wrap; }

/* Bulgu dağılımı */
.dagilim { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; break-inside:avoid; }
.kutu { border:1px solid var(--line); border-left:3px solid var(--c); border-radius:8px; padding:8px 10px; }
.kutu .h { display:flex; align-items:center; gap:5px; font-size:8pt; color:var(--muted); }
.kutu .h svg { color:var(--c); }
.kutu .s { font-size:18pt; font-weight:700; line-height:1.15; font-variant-numeric:tabular-nums; }
.kutu.sifir .s { color:var(--faint); }
.cubuk { display:flex; height:8px; border-radius:4px; overflow:hidden; background:var(--soft2); margin-top:10px; }
.cubuk i { background:var(--c); }

/* Bulgu listesi tablosu */
table.liste { width:100%; border-collapse:collapse; font-size:8.6pt; }
.liste th { text-align:left; font-size:7.3pt; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600; padding:6px 8px; background:var(--soft2); }
.liste td { padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
.liste tr { break-inside:avoid; }
.liste td.k { font:8.2pt var(--mono); color:var(--ink2); overflow-wrap:anywhere; }
.liste td.no { font:600 8.2pt var(--mono); color:var(--muted); white-space:nowrap; }
.rozet { display:inline-flex; align-items:center; gap:4px; font-size:7.2pt; font-weight:700; letter-spacing:.06em; text-transform:uppercase; white-space:nowrap;
  padding:2px 7px; border-radius:5px; color:var(--c); background:color-mix(in srgb, var(--c) 10%, #fff); border:1px solid color-mix(in srgb, var(--c) 45%, #fff); }
.rozet svg { width:1em; height:1em; }

/* Bulgu ayrıntısı */
.bulgu { border:1px solid var(--line); border-radius:10px; margin-bottom:12px; overflow:hidden; position:relative; }
.bulgu::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--c); }
.b-bas { padding:10px 14px 9px 16px; background:var(--soft); border-bottom:1px solid var(--line); break-inside:avoid; break-after:avoid; }
.b-ust { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.b-ust .no { font:600 8.4pt var(--mono); color:var(--muted); }
.b-bas h3 { margin:5px 0 0; font-size:10.5pt; line-height:1.35; }
.etiketler { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.etiketler span { font-size:7.6pt; padding:2px 7px; border-radius:5px; border:1px solid var(--line); background:#fff; color:var(--ink2); }
.etiketler .yer { font-family:var(--mono); color:var(--accent); overflow-wrap:anywhere; }
.b-govde { padding:4px 14px 12px 16px; }
.b-govde h4 { margin:10px 0 3px; font-size:7.4pt; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600; }
.b-govde p { margin:0; color:var(--ink2); white-space:pre-wrap; }
pre.kanit { margin:0; padding:8px 10px; border-radius:6px; background:#0f172a; color:#e2e8f0; font:8pt/1.55 var(--mono);
  white-space:pre-wrap; overflow-wrap:anywhere; word-break:break-all; }
.oneri { margin-top:10px; padding:8px 11px; border-radius:6px; background:#f0fdf4; border:1px solid #bbf7d0; color:#14532d; break-inside:avoid; }
.oneri b { display:flex; align-items:center; gap:5px; font-size:7.4pt; letter-spacing:.12em; text-transform:uppercase; color:var(--good); margin-bottom:2px; }
.oneri div { white-space:pre-wrap; }

.temiz { display:flex; gap:12px; align-items:center; padding:12px 14px; border-radius:10px; background:#f0fdf4; border:1px solid #bbf7d0; color:#14532d; break-inside:avoid; }
.temiz svg { width:22px; height:22px; color:var(--good); }
ul.iyi { list-style:none; margin:0; padding:0; }
.iyi li { display:flex; gap:8px; padding:5px 0; border-bottom:1px dashed var(--line); color:var(--ink2); break-inside:avoid; }
.iyi li svg { color:var(--good); margin-top:2px; }
.dosyalar { columns:2; column-gap:18px; font:7.8pt/1.6 var(--mono); color:var(--ink2); margin:0; padding:0; list-style:none; }
.dosyalar li { break-inside:avoid; overflow-wrap:anywhere; padding-left:10px; text-indent:-10px; }
.dosyalar li::before { content:"· "; color:var(--faint); }
pre.ham { margin:0; white-space:pre-wrap; font:8.4pt/1.55 var(--mono); background:var(--soft); border:1px solid var(--line); border-radius:8px; padding:10px; }

/* Yöntem notu */
.yontem { margin-top:22px; padding:12px 14px; border-radius:10px; background:var(--soft); border:1px solid var(--line); font-size:8.2pt; color:var(--ink2); break-inside:avoid; }
.yontem b { color:var(--ink); }
.yontem dl { display:grid; grid-template-columns:auto 1fr; gap:3px 10px; margin:8px 0 0; }
.yontem dt { display:flex; } .yontem dd { margin:0; }
.bos { padding:60px 20px; text-align:center; color:var(--muted); }
</style>
</head>
<body>
<div class="arac" id="arac">
  <a href="/guvenlik" id="geri"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>Raporlara dön</a>
  <span class="sp"></span>
  <span class="durum" id="durum" role="status"></span>
  <button id="yazdir" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>Yazdır</button>
  <button id="indir" class="ana" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>PDF indir</button>
</div>
<main class="kagit" id="kagit"></main>

<script>
// Sunucu bu satırı rapor verisiyle değiştirir: { rapor, surum }
const VERI = /*RAPOR*/null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const icon = (p) => `<svg class="i" viewBox="0 0 24 24">${p}</svg>`;
// Uzun yol: kelime ortasından değil, / ve \ sonrasından satır kırılsın
const yol = (p) => esc(p).replace(/([\/\\])/g, "$1<wbr>");
const SEV = {
  critical: { ad:"Kritik", c:"var(--crit)", ic:'<path d="M7.9 2h8.2L22 7.9v8.2L16.1 22H7.9L2 16.1V7.9z"/><path d="M12 8v4M12 16h.01"/>',
    tanim:"Doğrudan istismar edilebilir, ciddi etki (ör. uzaktan komut çalıştırma, depoya girmiş canlı gizli anahtar)." },
  high:     { ad:"Yüksek", c:"var(--high)", ic:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
    tanim:"İstismar edilebilir, önemli etki (ör. SQL enjeksiyonu, kalıcı XSS, eksik yetki kontrolü)." },
  medium:   { ad:"Orta",   c:"var(--med)",  ic:'<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>',
    tanim:"Belirli koşullarda istismar edilebilir ya da etkisi sınırlı." },
  low:      { ad:"Düşük",  c:"var(--low)",  ic:'<circle cx="12" cy="12" r="10"/><path d="M8 12h8"/>',
    tanim:"Düşük etkili zayıflık, bilgi sızıntısı." },
  info:     { ad:"Bilgi",  c:"var(--info)", ic:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
    tanim:"Sağlamlaştırma önerisi; açık değil." },
};
const ORDER = ["critical", "high", "medium", "low", "info"];
const RISK = {
  none:     { ad:"Risk yok", c:"var(--good)", n:0, aciklama:"Denetimde bildirilecek bir güvenlik açığı bulunmadı." },
  low:      { ad:"Düşük",    c:"var(--low)",  n:1, aciklama:"Düşük etkili zayıflıklar var; acil müdahale gerektirmiyor, planlı olarak giderilmeli." },
  medium:   { ad:"Orta",     c:"var(--med)",  n:2, aciklama:"Belirli koşullarda istismar edilebilecek zayıflıklar var; yakın zamanda ele alınmalı." },
  high:     { ad:"Yüksek",   c:"var(--high)", n:3, aciklama:"İstismar edilebilir ve önemli etki taşıyan bulgular var; öncelikle giderilmeli." },
  critical: { ad:"Kritik",   c:"var(--crit)", n:4, aciklama:"Doğrudan istismar edilebilir, ciddi etkili bulgular var; hemen müdahale edilmeli." },
};
const RISK_ORDER = ["none", "low", "medium", "high", "critical"];
const I = {
  shield:'<path d="M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5z"/><path d="m9 12 2 2 4-4"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  wrench:'<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9z"/>',
  file:  '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
};
const tarih = (iso) => new Date(iso).toLocaleString("tr-TR", { day:"2-digit", month:"long", year:"numeric", hour:"2-digit", minute:"2-digit" });

function kalkan(renk) {
  return `<svg viewBox="0 0 120 136" aria-hidden="true">
    <path d="M60 4 10 22v38c0 33 21 58 50 72 29-14 50-39 50-72V22z" fill="${renk}" fill-opacity=".10" stroke="${renk}" stroke-width="3"/>
    <path d="M60 17 21 31v29c0 26 16 46 39 58 23-12 39-32 39-58V31z" fill="none" stroke="${renk}" stroke-opacity=".4" stroke-width="1.4" stroke-dasharray="3 4"/>
  </svg>`;
}

function ciz(r, surum) {
  const rk = RISK[r.risk] || null;
  const renk = rk ? rk.c : "var(--accent)";
  const c = Object.fromEntries(ORDER.map((s) => [s, 0]));
  for (const f of r.findings) if (f.severity in c) c[f.severity]++;
  const toplam = r.findings.length;
  // Denetçi şemayı doldurmadıysa bulgu sayısı bilinmiyor — "0" yazıp yanıltmayalım
  const hamMetin = r.rawText !== undefined && !toplam;
  const kod = (i) => `B-${String(i + 1).padStart(2, "0")}`;
  let n = 0;
  const bolum = (baslik, icerik) => `<section><h2><span class="n">${String(++n).padStart(2, "0")}</span>${baslik}</h2>${icerik}</section>`;

  const kunye = [
    ["Denetim tarihi", esc(tarih(r.createdAt))],
    ["Kapsam", r.standalone ? "Bağımsız denetim — kod tabanının tamamı" : "Akış içi denetim — Saha Timi'nin değiştirdiği dosyalar"],
    ["Proje dizini", yol(r.targetDir), "mono"],
    r.model ? ["Model", esc(r.model), "mono"] : null,
    r.sessionName ? ["Oturum", esc(r.sessionName)] : null,
    [r.standalone ? "İncelenen dosya" : "Denetlenen dosya", `${r.files.length}`],
    ["Bulgu sayısı", hamMetin ? "— (yapılandırılmış rapor gelmedi)" : `${toplam}`],
  ].filter(Boolean).map(([k, v, cls]) => `<tr><th>${k}</th><td${cls ? ` class="${cls}"` : ""}>${v}</td></tr>`).join("");

  const kapak = `
    <header class="bas">
      <div class="marka"><div class="m">${icon(I.shield)}</div><div><b>KURMAY</b><span>Güvenlik Denetim Raporu</span></div></div>
      <span class="sp"></span>
      <div class="no">Rapor no<b>${esc(r.id)}</b>${esc(tarih(r.createdAt))}</div>
    </header>
    <div class="serit"></div>
    <span class="tur">${icon(I.shield)}${r.standalone ? "Kod tabanı denetimi" : "Görev denetimi"}</span>
    <h1>${esc(r.task)}</h1>
    <div class="risk" style="--c:${renk}">
      <div class="kalkan">${kalkan(renk)}<div class="y"><b>${rk ? esc(rk.ad) : "—"}</b><span>genel risk</span></div></div>
      <div>
        <div class="etiket">Genel risk düzeyi</div>
        <div class="seviye">${rk ? esc(rk.ad) : "Belirlenemedi"}</div>
        <div class="olcek">${RISK_ORDER.map((k, i) => `<i class="${rk && i <= rk.n ? "d" : ""}"></i>`).join("")}</div>
        <div class="olcek-y">${RISK_ORDER.map((k) => `<span class="${r.risk === k ? "s" : ""}">${RISK[k].ad}</span>`).join("")}</div>
        <p>${rk ? esc(rk.aciklama) : "Denetçi yapılandırılmış rapor üretmediği için risk düzeyi belirlenemedi."}</p>
      </div>
    </div>
    <table class="kunye">${kunye}</table>`;

  const dagilim = hamMetin ? "" : bolum("Bulgu dağılımı", `
    <div class="dagilim">${ORDER.map((s) => `<div class="kutu${c[s] ? "" : " sifir"}" style="--c:${SEV[s].c}">
      <div class="h">${icon(SEV[s].ic)}${SEV[s].ad}</div><div class="s">${c[s]}</div></div>`).join("")}</div>
    ${toplam ? `<div class="cubuk" role="img" aria-label="Önem derecesine göre bulgu oranları">${ORDER.filter((s) => c[s])
      .map((s) => `<i style="--c:${SEV[s].c};width:${(c[s] / toplam) * 100}%"></i>`).join("")}</div>` : ""}`);

  const ozet = r.summary ? bolum("Yönetici özeti", `<p class="ozet">${esc(r.summary)}</p>`) : "";

  let bulgular = "";
  if (hamMetin) {
    bulgular = bolum("Denetçinin metni", `<p class="ozet" style="margin-bottom:8px">Denetçi yapılandırılmış rapor üretmedi; yazdığı metin aşağıda olduğu gibi.</p><pre class="ham">${esc(r.rawText)}</pre>`);
  } else if (!toplam) {
    bulgular = bolum("Bulgular", `<div class="temiz">${icon(I.check)}<div><b>Güvenlik açığı bulunmadı.</b><br>${r.standalone ? "Denetlenen kod tabanında" : "Denetlenen değişikliklerde"} bildirilecek bir sorun yok.</div></div>`);
  } else {
    const yer = (f) => f.file ? `${f.file}${f.line ? ":" + f.line : ""}` : "—";
    bulgular = bolum("Bulgu listesi", `<table class="liste">
      <thead><tr><th>No</th><th>Önem</th><th>Bulgu</th><th>Konum</th></tr></thead>
      <tbody>${r.findings.map((f, i) => {
        const s = SEV[f.severity] || SEV.info;
        return `<tr><td class="no">${kod(i)}</td><td><span class="rozet" style="--c:${s.c}">${icon(s.ic)}${s.ad}</span></td>
          <td>${esc(f.title)}${f.category ? `<div style="color:var(--muted);font-size:7.8pt">${esc(f.category)}${f.cwe ? " · " + esc(f.cwe) : ""}</div>` : ""}</td>
          <td class="k">${yol(yer(f))}</td></tr>`;
      }).join("")}</tbody></table>`)
    + bolum("Bulgu ayrıntıları", r.findings.map((f, i) => {
        const s = SEV[f.severity] || SEV.info;
        return `<article class="bulgu" style="--c:${s.c}">
          <div class="b-bas">
            <div class="b-ust"><span class="no">${kod(i)}</span><span class="rozet" style="--c:${s.c}">${icon(s.ic)}${s.ad}</span></div>
            <h3>${esc(f.title)}</h3>
            <div class="etiketler">${f.file ? `<span class="yer">${yol(yer(f))}</span>` : ""}${f.category ? `<span>${esc(f.category)}</span>` : ""}${f.cwe ? `<span>${esc(f.cwe)}</span>` : ""}</div>
          </div>
          <div class="b-govde">
            ${f.description ? `<h4>Açıklama</h4><p>${esc(f.description)}</p>` : ""}
            ${f.evidence ? `<h4>Kanıt</h4><pre class="kanit">${esc(f.evidence)}</pre>` : ""}
            ${f.recommendation ? `<div class="oneri"><b>${icon(I.wrench)}Öneri</b><div>${esc(f.recommendation)}</div></div>` : ""}
          </div>
        </article>`;
      }).join(""));
  }

  const iyi = r.positives && r.positives.length
    ? bolum("Doğru yapılanlar", `<ul class="iyi">${r.positives.map((p) => `<li>${icon(I.check)}<span>${esc(p)}</span></li>`).join("")}</ul>`) : "";
  const DOSYA_EN_FAZLA = 400;
  const dosyalar = r.files.length
    ? bolum(r.standalone ? "İncelenen dosyalar" : "Denetlenen dosyalar", `<ul class="dosyalar">${r.files.slice(0, DOSYA_EN_FAZLA).map((f) => `<li>${yol(f)}</li>`).join("")}${
        r.files.length > DOSYA_EN_FAZLA ? `<li>… ve ${r.files.length - DOSYA_EN_FAZLA} dosya daha</li>` : ""}</ul>`) : "";

  const yontem = `<div class="yontem"><b>Yöntem ve sınırlar.</b> Bu rapor Kurmay'ın Güvenlik Denetçisi tarafından ${r.standalone
      ? "seçilen dizindeki kod okunarak" : "Teftiş onayından sonra değişen dosyalar okunarak"} otomatik olarak üretildi${surum ? ` (Kurmay ${esc(surum)})` : ""}.
    Denetçi kodu değiştirmez, yalnızca okur; bulgular otomatik analiz sonucudur ve uygulanmadan önce bir geliştirici tarafından doğrulanmalıdır.
    Bulgu olmaması, kodda açık olmadığının garantisi değildir.
    <dl>${ORDER.map((s) => `<dt><span class="rozet" style="--c:${SEV[s].c}">${icon(SEV[s].ic)}${SEV[s].ad}</span></dt><dd>${SEV[s].tanim}</dd>`).join("")}</dl></div>`;

  $("kagit").innerHTML = kapak + dagilim + ozet + bulgular + iyi + dosyalar + yontem;

  // Sayfa altı: sol rapor no, sağ sayfa numarası (başsız tarayıcının kendi başlık/altlığı kapalı)
  const alt = document.createElement("style");
  alt.textContent = `@page { @bottom-left { content:${JSON.stringify(`Kurmay · Güvenlik Denetim Raporu · ${r.id}`)}; font:7.5pt "Geist",sans-serif; color:#94a3b8; }
    @bottom-right { content:"Sayfa " counter(page) " / " counter(pages); font:7.5pt "Geist",sans-serif; color:#94a3b8; } }`;
  document.head.appendChild(alt);
  document.title = `Güvenlik Denetim Raporu — ${r.task}`;
  $("geri").href = "/guvenlik#" + encodeURIComponent(r.id);
}

if (VERI && VERI.rapor) ciz(VERI.rapor, VERI.surum);
else $("kagit").innerHTML = `<div class="bos">Rapor bulunamadı.</div>`;

// Araç çubuğu: Yazdır = tarayıcının yazdırma penceresi ("PDF olarak kaydet" de oradan);
// PDF indir = sunucu bilgisayardaki tarayıcıyla PDF basar, olmazsa yazdırma penceresine düşer
$("yazdir").addEventListener("click", () => window.print());
$("indir").addEventListener("click", async () => {
  if (!VERI || !VERI.rapor) return;
  const b = $("indir");
  b.disabled = true; $("durum").textContent = "";
  try {
    const res = await fetch(`/security-reports/${encodeURIComponent(VERI.rapor.id)}/pdf`);
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || "PDF üretilemedi");
    const ad = decodeURIComponent((res.headers.get("content-disposition") || "").match(/filename\*=UTF-8''([^;]+)/)?.[1] || "guvenlik-raporu.pdf");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(await res.blob());
    a.download = ad;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  } catch (err) {
    $("durum").textContent = `${err.message} — yazdırma penceresinde "PDF olarak kaydet"i seç`;
    window.print();
  } finally {
    b.disabled = false;
  }
});
// ?yazdir: rapor sayfasındaki "PDF indir" buraya düştüyse (bilgisayarda PDF basacak tarayıcı yok)
if (new URLSearchParams(location.search).has("yazdir")) {
  $("durum").textContent = "Yazdırma penceresinde hedef olarak \"PDF olarak kaydet\"i seç";
  $("durum").style.color = "#fde68a";
  window.addEventListener("load", () => setTimeout(() => window.print(), 300));
}
</script>
</body>
</html>
