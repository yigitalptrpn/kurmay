services:
  kurmay:
    build: .
    container_name: kurmay
    ports:
      - "${PORT:-4141}:4141"
    environment:
      # Anthropic'e doğrudan bağlanmak için (Claude Code oturumu yerine)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # config.json'da baseUrl doluysa (ör. Ollama) kullanılan alanlar
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN:-}
      # TFS modu: erişim anahtarı (boşsa panelden girilen kullanılır — .gizli/tfs.json)
      - KURMAY_TFS_TOKEN=${KURMAY_TFS_TOKEN:-}
    volumes:
      # Orkestratör kaynağı + config.json + .claude/ — konteyner içinden canlı okunur,
      # persona/kural/config düzenlemeleri için yeniden build gerekmez
      - .:/app
      - /app/node_modules
      # Ajanların üzerinde çalışacağı hedef proje dizini (config.json'daki targetDir'i ezer)
      - ${TARGET_DIR:-./target}:/workspace/target
      # Analist'in konuşma kayıtları (Claude Code ~/.claude/projects) — kalıcı olmazsa
      # konteyner yeniden oluşunca oturumlar "konuşma bulunamadı" ile baştan başlar
      - kurmay-claude:/root/.claude
    command: ["--cwd", "/workspace/target", "--port", "4141"]
    restart: unless-stopped

volumes:
  kurmay-claude:
